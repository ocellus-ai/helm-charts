{{- if and .Values.service.enabled .Values.service.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ocellusai.fullname" . }}-ingress
  namespace: {{ include "ocellusai.namespace" . }}
  {{- with .Values.service.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.service.ingress.className }}
  ingressClassName: {{ .Values.service.ingress.className }}
  {{- end }}
  {{- if .Values.service.ingress.tls }}
  tls:
    {{- toYaml .Values.service.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  - host: {{ .Values.service.ingress.host }}
    http:
      paths:
      - path: {{ .Values.service.ingress.path }}
        pathType: {{ .Values.service.ingress.pathType }}
        backend:
          service:
            name: {{ include "ocellusai.fullname" . }}
            port:
              number: {{ .Values.service.k8sService.port }}
{{- end }}
